name: Open RAN xApp CI

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code quality
        run: python -m ruff check xapp tests

      - name: Run tests
        run: python -m pytest -v --cov=xapp
